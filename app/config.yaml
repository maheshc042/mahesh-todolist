# ---------------------------------------------------------------------------
# Naukri auto-apply agent — Full Stack & Web Engineer Profile Configuration.
# ---------------------------------------------------------------------------

browser:
  headless: true
  slow_mo_ms: 0
  viewport_width: 1440
  viewport_height: 900
  locale: en-IN
  timezone: Asia/Kolkata
  default_timeout_ms: 30000
  navigation_timeout_ms: 60000
  min_action_delay_ms: 350
  max_action_delay_ms: 1400
  block_resources: [font, media]

run:
  daily_application_cap: 60
  dedupe_window_days: 90
  max_consecutive_failures: 5
  min_delay_between_applies_s: 8
  max_delay_between_applies_s: 25
  max_retries_per_job: 2
  strict_answers: true
  screenshot_on_failure: true
  screenshot_on_success: false
  run_timeout_minutes: 120

schedule:
  enabled: true
  cron: "30 9,15 * * 1-5"
  timezone: Asia/Kolkata
  jitter_seconds: 600
  run_on_start: false

notifications:
  telegram_enabled: false
  notify_on_success: true
  notify_on_failure: true
  include_job_list: true
  max_jobs_in_message: 15

# Global screening-question knowledge base (Human-editable in YAML)
answers:
  # Notice Period & Availability
  serving notice: "Yes"
  immediate joiner: "Yes"
  notice period: "0 days"
  how soon can you join: "0 days"
  last working day: "30/04/2026"
  buyout option: "No"

  # Salary & CTC
  current ctc: "4"
  expected ctc: "7"
  fixed ctc: "3.8"
  variable ctc: "0"

  # Experience (2.6 Years)
  total experience: "2.6"
  relevant experience: "2.6"
  experience in react: "2.6"
  experience in node: "2.6"
  experience in javascript: "2.6"
  experience in typescript: "2.6"
  experience in full stack: "2.6"
  experience in aws: "1.5"
  experience in ai: "2.6"
  experience in artificial intelligence: "2.6"
  experience in chatbot: "2.6"
  experience in testing: "2.6"
  experience in software testing: "2.6"
  experience in python: "2.6"
  experience in .net: "0"
  experience in java: "0"

  # Academic Details
  10th percentage: "67"
  12th percentage: "75"
  secondary percentage: "75"
  sslc percentage: "67"
  puc percentage: "75"
  graduation percentage: "60"
  degree percentage: "60"
  cgpa: "6.5"
  post graduation: "NA"
  pg percentage: "NA"

  # College / Tier-1 / Institute Heuristics
  iit: "No"
  nit: "No"
  dtu: "No"
  iiit: "No"
  premier institute: "No"
  tier 1: "No"

  # Residing & Relocation Questions (Always Default to "Yes")
  residing: "Yes"
  relocate: "Yes"
  relocation: "Yes"
  residing or willing to relocate: "Yes"
  willing to relocate: "Yes"
  ready to relocate: "Yes"
  open to relocate: "Yes"
  current location: "Bengaluru"
  preferred location: "Bengaluru"
  are you willing to work from office: "Yes"
  hybrid mode: "Yes"

  # Reason for Change
  reason for job change: "Looking for better technical growth, challenging full-stack projects, and career advancement."
  why leaving: "Looking for better technical growth, challenging full-stack projects, and career advancement."
  why are you looking for a change: "Looking for better technical growth, challenging full-stack projects, and career advancement."

  # General HR
  do you have a valid passport: "Yes"
  highest qualification: "B.Tech"
  graduation year: "2023"
  any offer in hand: "No"
  "^yes/no$": "Yes"

profiles:
  - name: "Full Stack / Web Developer"
    enabled: true
    priority: 1
    experience_years: 2.6
    max_applications_per_run: 60
    resume_label: null
    resume_file: null
    searches:
      # Exact Master Browser Search URL with 3-6 & 6-10 LPA CTC filters + 2 yrs exp + 3-day freshness
      - keyword: "Master Full Stack & MERN Search"
        custom_url: "https://www.naukri.com/full-stack-node-dot-js-mern-stack-react-dot-js-nextjs-javascript-typescript-chatbot-fullstack-developer-fullstack-development-jobs?k=full+stack%2C+node.js%2C+mern+stack%2C+react.js%2C+nextjs%2C+javascript%2C+typescript%2C+chatbot%2C+fullstack+developer%2C+fullstack+development&nignbevent_src=jobsearchDeskGNB&experience=2&jobAge=3&ctcFilter=3to6&ctcFilter=6to10"
        max_pages: 25
    filters:
      # Broad tech stack titles including AI, Chatbot, Testing, QA, AWS
      title_must_include_any: [full stack, fullstack, mern, react, node, javascript, typescript, frontend, backend, aws, web, software, developer, engineer, qa, tester, support, ai, chatbot, testing]
      # Exclude strictly unrelated tech stacks
      title_must_exclude_any: [intern, sales, php, wordpress, .net, dotnet, dot net, c++, spring boot, java, bre, fircosoft, intersystems, mainframe, lead, manager, director, vp]
      description_must_exclude_any: ["bpo", "night shift", "commission only", ".net developer", "asp.net", "c#", "spring boot", "ruby on rails", "php developer"]
      allowed_locations: []
      blocked_locations: []
      blocked_companies: []
      experience:
        min_years: 1
        max_years: 5
      min_salary_lpa: null
      max_posted_days: 3
      min_rating: null
      require_easy_apply: true
      skip_walkin: true
    answers:
      relevant experience: "2.6"
      total experience: "2.6"
      current ctc: "4"
      expected ctc: "7"
      notice period: "0 days"
      last working day: "30/04/2026"
