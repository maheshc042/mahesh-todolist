name: Naukri Auto-Apply Agent

on:
  # Morning (03:03 UTC = 08:33 AM IST) and Afternoon (08:03 UTC = 01:33 PM IST)
  # 5 hours apart to prevent IP throttling and rate limiting on Naukri
  schedule:
    - cron: '03 3 * * *'
    - cron: '03 8 * * *'
  workflow_dispatch:
    # Allow manual runs to choose which account to run (defaults to primary)
    inputs:
      account:
        description: 'Account to run (primary, secondary, or all-accounts)'
        required: true
        default: 'primary'
        type: choice
        options:
          - primary
          - secondary
          - all-accounts

concurrency:
  group: naukri-auto-apply-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Download Latest Resumes from Vercel
        run: |
          mkdir -p resumes
          curl --fail --retry 3 --retry-all-errors --silent --show-error --location "https://mahesh-resume.vercel.app/Mahesh_Chitakoti_FullStack_Engineer.pdf" -o resumes/CV_Mahesh_Chitakoti_2026_1_.pdf
          curl --fail --retry 3 --retry-all-errors --silent --show-error --location "https://mahesh-resume.vercel.app/Mahesh_Chitakoti_AI_Engineer.pdf" -o resumes/CV_Mahesh_Chitakoti_2026.pdf
          cp resumes/CV_Mahesh_Chitakoti_2026_1_.pdf resumes/Mahesh_Chitakoti_FullStack_Engineer.pdf
          cp resumes/CV_Mahesh_Chitakoti_2026.pdf resumes/Mahesh_Chitakoti_AI_Engineer.pdf
          test -s resumes/CV_Mahesh_Chitakoti_2026_1_.pdf
          test -s resumes/CV_Mahesh_Chitakoti_2026.pdf

      - name: Validate required configuration
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$NAUKRI_EMAIL"
          test -n "$NAUKRI_PASSWORD"
          test -n "$DATABASE_URL"

      - name: Migrate database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA || 'naukri' }}
          DB_SSL_INSECURE: "true"
          BROWSER_SESSION_SECRET: ${{ secrets.BROWSER_SESSION_SECRET }}
        run: python -m naukri_agent migrate

      - name: Run Naukri Agent
        env:
          # --- Core & Database ---
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA || 'naukri' }}
          DB_POOL_MIN_SIZE: ${{ secrets.DB_POOL_MIN_SIZE || '1' }}
          BROWSER_SESSION_SECRET: ${{ secrets.BROWSER_SESSION_SECRET }}
          DB_SSL_INSECURE: "true"
          HEADLESS: "true"
          DEFAULT_ACCOUNT: ${{ secrets.DEFAULT_ACCOUNT || 'primary' }}

          # --- Naukri Accounts ---
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_EMAIL_2: ${{ secrets.NAUKRI_EMAIL_2 }}
          NAUKRI_PASSWORD_2: ${{ secrets.NAUKRI_PASSWORD_2 }}

          # --- AI Personalized Pitches & Cover Letters ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # --- Cold Email Outreach ---
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MATCHED_OUTREACH_ENABLED: ${{ secrets.MATCHED_OUTREACH_ENABLED || 'true' }}
          # Hunter auth for the LinkedIn content search (persistent browser
          # profiles don't exist on fresh CI runners, so the li_at cookie is
          # the only session the hunter gets here; absent = 0 leads, silently).
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}

          # --- Multi-Platform Credentials ---
          INSTAHYRE_EMAIL: ${{ secrets.INSTAHYRE_EMAIL }}
          INSTAHYRE_PASSWORD: ${{ secrets.INSTAHYRE_PASSWORD }}
          CUTSHORT_EMAIL: ${{ secrets.CUTSHORT_EMAIL }}
          CUTSHORT_PASSWORD: ${{ secrets.CUTSHORT_PASSWORD }}
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}

          # --- Telegram Alerts ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # If triggered manually, use the input provided by the user
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.account }}" == "all-accounts" ]; then
              python -m naukri_agent run --all-accounts
            else
              python -m naukri_agent run -a ${{ github.event.inputs.account }}
            fi
          else
            # If triggered by Cron schedule, check the UTC hour
            CURRENT_HOUR=$(date -u +"%H")
            CURRENT_HOUR_NUM=$((10#$CURRENT_HOUR))

            # 02:00 - 05:59 UTC is the Morning window -> Primary Account (AI / Python)
            if [ "$CURRENT_HOUR_NUM" -ge 2 ] && [ "$CURRENT_HOUR_NUM" -le 5 ]; then
              echo "Morning Run Detected (UTC $CURRENT_HOUR): Running Primary Account"
              python -m naukri_agent run -a primary

            # 07:00 - 11:59 UTC is the Afternoon window -> Secondary Account (Full Stack / MERN)
            elif [ "$CURRENT_HOUR_NUM" -ge 7 ] && [ "$CURRENT_HOUR_NUM" -le 11 ]; then
              echo "Afternoon Run Detected (UTC $CURRENT_HOUR): Running Secondary Account"
              python -m naukri_agent run -a secondary

            else
              echo "Outside standard schedule windows (UTC $CURRENT_HOUR), running both accounts sequentially."
              python -m naukri_agent run --all-accounts
            fi
          fi

      - name: Upload diagnostics & CSV Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: naukri-agent-diagnostics-${{ github.run_id }}
          path: |
            logs/
            artifacts/
            analysis/
          if-no-files-found: ignore
          retention-days: 7
