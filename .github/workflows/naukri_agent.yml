name: Naukri Auto-Apply Agent

on:
  # Morning (03:03 UTC = 08:33 AM IST) and Afternoon (08:03 UTC = 01:33 PM IST)
  # 5 hours apart to prevent IP throttling and rate limiting on Naukri
  schedule:
    - cron: '03 3 * * *'
    - cron: '03 8 * * *'
  workflow_dispatch:
    # Allow manual runs to choose which account to run (defaults to primary)
    inputs:
      account:
        description: 'Account to run (primary, secondary, or all-accounts)'
        required: true
        default: 'primary'
        type: choice
        options:
          - primary
          - secondary
          - all-accounts

concurrency:
  group: naukri-auto-apply-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Download Latest Resumes from Vercel
        run: |
          mkdir -p resumes
          curl --fail --retry 3 --retry-all-errors --silent --show-error --location "https://mahesh-resume.vercel.app/Mahesh_Chitakoti_FullStack_Engineer.pdf" -o resumes/Mahesh_Chitakoti_FullStack_Engineer.pdf
          curl --fail --retry 3 --retry-all-errors --silent --show-error --location "https://mahesh-resume.vercel.app/Mahesh_Chitakoti_AI_Engineer.pdf" -o resumes/Mahesh_Chitakoti_AI_Engineer.pdf
          test -s resumes/Mahesh_Chitakoti_FullStack_Engineer.pdf
          test -s resumes/Mahesh_Chitakoti_AI_Engineer.pdf

      - name: Validate required configuration
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$NAUKRI_EMAIL"
          test -n "$NAUKRI_PASSWORD"
          test -n "$DATABASE_URL"

      - name: Migrate database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL_INSECURE: "true"
          BROWSER_SESSION_SECRET: ${{ secrets.BROWSER_SESSION_SECRET }}
        run: python -m naukri_agent migrate

      - name: Run Naukri Agent
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_EMAIL_2: ${{ secrets.NAUKRI_EMAIL_2 }}
          NAUKRI_PASSWORD_2: ${{ secrets.NAUKRI_PASSWORD_2 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: "true"
          DB_SSL_INSECURE: "true"
          BROWSER_SESSION_SECRET: ${{ secrets.BROWSER_SESSION_SECRET }}
        run: |
          # If triggered manually, use the input provided by the user
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.account }}" == "all-accounts" ]; then
              python -m naukri_agent run --all-accounts
            else
              python -m naukri_agent run -a ${{ github.event.inputs.account }}
            fi
          else
            # If triggered by Cron schedule, check the UTC hour
            CURRENT_HOUR=$(date -u +"%H")
            
            # 03:xx UTC is the Morning run -> Primary Account
            if [ "$CURRENT_HOUR" == "03" ]; then
              echo "Morning Run Detected: Running Primary Account"
              python -m naukri_agent run -a primary
              
            # 08:xx UTC is the Afternoon run -> Secondary Account
            elif [ "$CURRENT_HOUR" == "08" ]; then
              echo "Afternoon Run Detected: Running Secondary Account"
              python -m naukri_agent run -a secondary
              
            else
              echo "Unknown schedule hour ($CURRENT_HOUR), running primary as fallback."
              python -m naukri_agent run -a primary
            fi
          fi

      - name: Upload diagnostics & CSV Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: naukri-agent-diagnostics-${{ github.run_id }}
          path: |
            logs/
            artifacts/
            analysis/
          if-no-files-found: ignore
          retention-days: 7
