# ---------------------------------------------------------------------------
# Naukri auto-apply agent.
#
# TWO ACCOUNTS, TWO RESUMES:
#   primary   (NAUKRI_EMAIL)   -> Full Stack / MERN + AI resume
#   secondary (NAUKRI_EMAIL_2) -> AI / Python Engineer resume
#
# Naukri attaches whatever resume sits on the PROFILE — there is no per-
# application resume picker — so one account == one resume == one job family.
# Each profile below is bound to its account with `account:`, and a run only
# ever touches one account (`run -a primary`, `run --all-accounts` for both,
# sequentially).
#
# SOURCE: Naukri's own "Recommended jobs" feed only. Naukri has already matched
# those postings against the profile, headline, skills and preferences, so it
# beats any keyword query. The keyword-search fallback is left configured but
# disabled (`searches: []`) — see the commented block on the Full-Stack profile
# to re-enable it.
# ---------------------------------------------------------------------------

browser:
  headless: true
  slow_mo_ms: 0
  viewport_width: 1440
  viewport_height: 900
  locale: en-IN
  timezone: Asia/Kolkata
  default_timeout_ms: 10000        # Fail-fast UI checks (10s)
  navigation_timeout_ms: 20000     # Fail-fast page loads (20s max)
  min_action_delay_ms: 250
  max_action_delay_ms: 800
  block_resources: [font, media]

run:
  daily_application_cap: 35
  dedupe_window_days: 90
  max_consecutive_failures: 5
  min_delay_between_applies_s: 4   # Safe human pacing (4-10s)
  max_delay_between_applies_s: 10  # Safe human pacing (4-10s)
  max_retries_per_job: 1           # No more double-retries on dead pages
  strict_answers: true
  screenshot_on_failure: true
  screenshot_on_success: false
  run_timeout_minutes: 45          # Strict 45-minute cloud limit per account

# Naukri's recommended feed — the primary (and by default only) job source.
recommended:
  enabled: true
  tabs: ["default", "all"]
  max_scroll_rounds: 20
  stall_rounds_before_stop: 2
  max_jobs: 300
  follow_show_more: true

schedule:
  enabled: true
  # Default, used by any account without an override below.
  cron: "40 9 * * *"
  # The two accounts MUST be hours apart: two logins from one IP inside the same
  # window is the pattern most likely to trigger Naukri's "unusual activity"
  # challenge. Morning for Full-Stack, afternoon for AI/Python.
  cron_by_account:
    primary: "0 9 * * *"     # 09:00 AM IST (Morning recruiter search window)
    secondary: "0 13 * * *"  # 01:00 PM IST (Afternoon recruiter search window — 4h gap prevents IP throttling)
  timezone: Asia/Kolkata
  jitter_seconds: 600
  run_on_start: false

notifications:
  telegram_enabled: true
  notify_on_success: true
  notify_on_failure: true
  include_job_list: true
  max_jobs_in_message: 15

