# ---------------------------------------------------------------------------
# Skill -> years map. This answers the open-ended "how many years of X?" family
# that no finite answer table can cover: the engine detects the intent, sees
# which of these skills the question names, and combines them with
# `multi_skill_strategy` ("HTML, CSS, JavaScript" -> max = the stack as a whole).
# Anything not listed falls back to `default_years`.
# ---------------------------------------------------------------------------
experience:
  total_years: 2.6
  default_years: 2.6
  multi_skill_strategy: max
  skills:
    html: 2.6
    css: 2.6
    javascript: 2.6
    js: 2.6
    react: 2.6
    node: 2.6
    typescript: 2.6
    full stack: 2.6
    # AI / Python is the newer track: 6 months hands-on. Keep these honest —
    # recruiters cross-check them against the resume.
    ai: 0.6
    artificial intelligence: 0.6
    machine learning: 0.6
    python: 0.6
    llm: 0.6
    generative ai: 0.6
    nlp: 0.6
    langchain: 0.6
    fastapi: 0.6
    chatbot: 0.6
    unix: 2.6
    linux: 2.6
    cloud: 2.0
    aws: 2.0
    aml: 0
    fircosoft: 0

# ---------------------------------------------------------------------------
# Daily "touch the profile" pass. Naukri's recruiter search sorts candidates by
# profile-last-updated, so a stale profile is invisible past page one. This is
# quota-free and usually generates more inbound contact than applying does.
# `min_hours_between` is enforced against the profile_updates table, so several
# runs (or a container restart) still produce exactly one edit per day —
# repeated edits in one day is what Naukri's abuse heuristics look for.
# ---------------------------------------------------------------------------
profile_refresh:
  enabled: true
  # First success wins. `skills` is deliberately not listed: the tag editor can
  # drop a skill chip on a mis-timed keystroke.
  strategies: ["headline"]
  min_hours_between: 20
  verify: true

# ---------------------------------------------------------------------------
# Match Score API pre-filter.
#
# Calls Naukri's internal matchscore API (no browser required) before
# navigating to each job page. Jobs with keyskills_score == 0 are
# irrelevant — skip them and save ~4 seconds per job.
#
# Fail-open: if the API is down, times out, or returns an error, the job
# is NOT skipped — it falls through to the normal Playwright apply flow.
# This means the API can never block applications.
#
# To disable entirely: set enabled: false
# ---------------------------------------------------------------------------
match_score_prefilter:
  enabled: true
  min_keyskills_score: 1        # 0 = no keyword match at all, skip; 1+ = some overlap, apply
  request_timeout_s: 5.0
  max_concurrent: 3             # parallel score fetches (stay under Naukri rate limit)
  fail_open: true               # on any API error, apply anyway

# ---------------------------------------------------------------------------
# Profiles. One per account.
# ---------------------------------------------------------------------------
profiles:
  # =========================================================================
  # ACCOUNT 1 (primary) — Full Stack / MERN, with AI-adjacent roles welcome.
  # The Full-Stack + AI resume must be the active CV on this Naukri profile.
  # =========================================================================
  - name: "Full Stack / Web Developer"
    enabled: true
    priority: 1
    account: primary
    experience_years: 2.6
    use_recommended: true
    max_applications_per_run: 25
    resume_label: "Full Stack Engineer"
    resume_file: "resumes/Mahesh_Chitakoti_FullStack_Engineer.pdf"

    # Recommended-only. To re-enable the keyword search as a TOP-UP (it only
    # runs when the feed did not fill max_applications_per_run), move the block
    # below under `searches:`.
    searches: []
    search_is_fallback_only: true
    # searches:
    #   - keyword: "Master Full Stack & MERN Search"
    #     custom_url: "https://www.naukri.com/full-stack-node-dot-js-mern-stack-react-dot-js-nextjs-javascript-typescript-chatbot-fullstack-developer-fullstack-development-jobs?k=full+stack%2C+node.js%2C+mern+stack%2C+react.js%2C+nextjs%2C+javascript%2C+typescript%2C+chatbot%2C+fullstack+developer%2C+fullstack+development&nignbevent_src=jobsearchDeskGNB&experience=2&jobAge=3&ctcFilter=3to6&ctcFilter=6to10"
    #     max_pages: 25

    # These rules apply to keyword search. The recommended feed automatically
    # uses `filters.relaxed()`: the inclusion lists and the freshness cap are
    # dropped (Naukri already matched the job), while every blocklist and the
    # experience sanity check are kept.
    filters:
      title_must_include_any: [full stack, fullstack, mern, react, node, javascript, typescript, frontend, backend, web, software, developer, engineer, ai, artificial intelligence, machine learning, ml, python, llm, genai, generative ai, chatbot, prompt, qa, testing, tester]
      title_must_exclude_any: [intern, internship, sales, bpo, php, wordpress, .net, dotnet, dot net, c++, spring boot, java developer, java, mainframe, sap, salesforce, drupal, magento, lead, manager, director, vp, head, architect, sr. manager]
      description_must_exclude_any: ["bpo", "night shift", "us shift", "commission only", "unpaid", ".net developer", "asp.net", "c#", "spring boot", "ruby on rails", "php developer", "wordpress developer", "registration fee", "security deposit", "prefers women", "women diversity", "women only", "female only"]
      allowed_locations: []
      blocked_locations: []
      blocked_companies: []
      experience:
        min_years: 0
        max_years: 3
      min_salary_lpa: null
      max_posted_days: 5
      min_rating: null
      require_easy_apply: true
      skip_walkin: true

    answers:
      relevant experience: "2.6"
      total experience: "2.6"
      current ctc: "4"
      expected ctc: "7"
      notice period: "0 days"
      last working day: "30/04/2026"
      reason for job change: "Looking for better technical growth and challenging full-stack projects."

  # =========================================================================
  # ACCOUNT 2 (secondary) — AI / Python Engineer.
  # The AI/Python resume must be the active CV on this Naukri profile.
  # 2.6 years total engineering experience, 6 months of it in AI/Python.
  # =========================================================================
  - name: "AI / Python Engineer"
    enabled: true
    priority: 2
    account: secondary
    experience_years: 2.6
    use_recommended: true
    max_applications_per_run: 25
    resume_label: "AI / Python Engineer"
    resume_file: "resumes/Mahesh_Chitakoti_AI_Engineer.pdf"

    searches: []
    search_is_fallback_only: true

    filters:
      title_must_include_any: [ai, artificial intelligence, machine learning, ml, python, llm, genai, generative ai, nlp, chatbot, prompt, agent, data science, data engineer, python developer, ai engineer, ml engineer, qa, testing, tester, backend, developer, engineer]
      title_must_exclude_any: [intern, internship, sales, bpo, php, wordpress, .net, dotnet, c++, java developer, java, devops, network, hardware, lead, manager, director, vp, head, principal, architect, staff engineer]
      description_must_exclude_any: ["bpo", "night shift", "us shift", "commission only", "unpaid", "phd required", "8+ years", "10+ years", "registration fee", "security deposit", ".net developer", "asp.net", "prefers women", "women diversity", "women only", "female only"]
      allowed_locations: []
      blocked_locations: []
      blocked_companies: []
      experience:
        min_years: 0
        max_years: 3
      min_salary_lpa: null
      max_posted_days: 5
      min_rating: null
      require_easy_apply: true
      skip_walkin: true

    # Honest split: 2.6 years total, 6 months specifically in AI/Python.
    # Recruiters cross-check these against the resume, so they must match it.
    answers:
      total experience: "2.6"
      relevant experience: "0.6"
      experience in ai: "0.6"
      experience in artificial intelligence: "0.6"
      experience in machine learning: "0.6"
      experience in python: "0.6"
      experience in llm: "0.6"
      experience in generative ai: "0.6"
      experience in nlp: "0.6"
      experience in langchain: "0.6"
      experience in fastapi: "0.6"
      experience in tensorflow: "0.6"
      experience in pytorch: "0.6"
      experience in data science: "0.6"
      current ctc: "4"
      expected ctc: "7"
      notice period: "0 days"
      last working day: "30/04/2026"
      reason for job change: "Transitioning fully into AI/Python engineering after building AI features on top of my full-stack work."
