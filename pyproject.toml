[project]
name = "naukri-agent"
version = "1.0.0"
description = "Production-grade Naukri.com auto-apply agent built on Playwright + PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "playwright==1.62.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "PyYAML>=6.0.2",
  "asyncpg>=0.30.0",
  "apscheduler>=3.11.0",
  "structlog>=24.4.0",
  "httpx>=0.28.1",
  "tenacity>=9.0.0",
  "typer>=0.16.1,<0.17",
  "rich>=13.9.4",
  "python-dotenv>=1.0.1",
  "cryptography>=44,<47",
  "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<1",
  "ruff>=0.9.0,<1",
]

[project.scripts]
naukri-agent = "naukri_agent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["naukri_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"
